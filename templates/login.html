<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css" />
</head>
<body class="bg-light adminbg">
    <div class="container-fluid m-5">
        <div class="row m-5">
            <div class="col-md-7 p-5 mt-5 border mx-auto text-white loginbg">
                <center>
                    <h3>Welcome to</h3>
                    <h2>State Load Despatch Center, Delhi</h2>
                    <hr>
                    <h2 class="">Admin Login</h2>
                </center>
                <form action="/login" method="post">
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" class="form-control" required><br>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" required class="form-control"><br><br>
                    <input type="submit" value="Login" class="btn btn-primary">
                    <a href="/signup" class="btn btn-outline-light">Sign Up</a>
                </form>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="{{ category }} text-danger">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>
        </div>
    </div>
</body>
</html>
